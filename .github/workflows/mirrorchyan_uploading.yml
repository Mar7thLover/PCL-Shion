name: Mirror Chyan (Upload)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      arch:
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

jobs:
  mirrorchyan_uploading:
    # 只在维护者配置了本项目自己的 MirrorChyan 资源后启用，禁止写入上游资源。
    if: ${{ vars.MIRRORCHYAN_RID != '' && vars.MIRRORCHYAN_RID != 'PCL2-CE' }}
    runs-on: macos-latest

    steps:
      - uses: MirrorChyan/uploading-action@ea9a0f6f516fafb6b0a3046a1fe4b0dccb29eca8 # v1
        with:
          filetype: latest-release
          filename: "PCL_Shion_${{ inputs.channel == 'stable' && 'Release' || 'Beta' }}_Avalonia_Windows-${{ inputs.arch == 'x64' && 'x64' || 'ARM64' }}.exe"
          mirrorchyan_rid: ${{ vars.MIRRORCHYAN_RID }}

          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: win
          arch: ${{ inputs.arch }}
          channel: ${{ inputs.channel }}
