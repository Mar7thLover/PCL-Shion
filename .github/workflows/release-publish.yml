name: Release publish

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
      version: ${{ inputs.version }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v${{ inputs.version }}"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          name: PCL Shion ${{ inputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/Plain Craft Launcher 2.exe" "PCL_Shion_${{ matrix.configuration }}_WPF_${{ matrix.architecture }}.exe"

      - name: Sign the binary
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCL_Shion_${{ matrix.configuration }}_WPF_${{ matrix.architecture }}.exe
          verify: true
          verify-cert-identity: https://github.com/Mar7thLover/PCL-Shion/.github/workflows/release-publish.yml@refs/heads/dev
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          files: |
            PCL_Shion_${{ matrix.configuration }}_WPF_${{ matrix.architecture }}.exe
            PCL_Shion_${{ matrix.configuration }}_WPF_${{ matrix.architecture }}.exe.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_shion:
    name: Build PCL Shion (${{ matrix.rid }})
    needs: [changelog]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # Windows 版与 WPF 版一同发布；在 Windows 上构建，才能把图标写入可执行文件
          - rid: win-x64
            os: windows-latest
            label: Windows-x64
          - rid: win-arm64
            os: windows-latest
            label: Windows-ARM64
          - rid: linux-x64
            os: ubuntu-latest
            label: Linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            label: Linux-ARM64
          - rid: osx-x64
            os: macos-latest
            label: macOS-Intel
          - rid: osx-arm64
            os: macos-latest
            label: macOS-AppleSilicon
      fail-fast: false
    env:
      # Windows 版是单个可执行文件，其他平台打包为 tar.gz 以保留可执行权限。
      # 文件名标明 Avalonia 与系统，如 PCL_Shion_Release_Avalonia_Windows-x64.exe；
      # 系统与架构用连字符连接，不会被 WPF 版的应用内更新（匹配 _x64.exe / _ARM64.exe）误选中
      PACKAGE: PCL_Shion_${{ inputs.configuration }}_Avalonia_${{ matrix.label }}${{ startsWith(matrix.rid, 'win-') && '.exe' || '.tar.gz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Avalonia 界面，自包含发布，用户无需另装 .NET 运行时
      # 设置 PCL_WRITE_SECRET 后，PCL_ 开头的环境变量会在构建时写入 PCL.Shion.Core 的 BuildSecrets
      - name: Publish
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish PCL.Shion/PCL.Shion.csproj -c ${{ inputs.configuration }} -r ${{ matrix.rid }} \
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:DebugType=none -p:Version=${{ inputs.version }} -p:UseSharedCompilation=false -o ./publish

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win-')
        run: mv ./publish/PCL.Shion.exe "$PACKAGE"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          chmod +x ./publish/PCL.Shion
          mkdir -p "./package/PCL Shion"
          cp -R ./publish/. "./package/PCL Shion/"
          tar -czf "$PACKAGE" -C ./package "PCL Shion"

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          app="./package/PCL Shion.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R ./publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/PCL.Shion"
          sed "s/@VERSION@/${{ inputs.version }}/g" PCL.Shion/Packaging/macOS/Info.plist > "$app/Contents/Info.plist"
          iconset=./icon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256; do
            sips -z $size $size PCL.Shion/Assets/Images/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 64 128; do
            cp "$iconset/icon_$((size * 2))x$((size * 2)).png" "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
          # 没有开发者证书，做一次临时签名，否则 Apple 芯片上无法启动
          codesign --force --deep --sign - "$app"
          tar -czf "$PACKAGE" -C ./package "PCL Shion.app"

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_Shion_${{ inputs.configuration }}_${{ matrix.rid }}
          path: ${{ env.PACKAGE }}

  # 签名统一在 Linux 上进行，与 WPF 版的签名方式一致
  release_shion:
    needs: [build_shion, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PCL_Shion_${{ inputs.configuration }}_*-*
          path: ./dist
          merge-multiple: true

      - name: Sign the packages
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*
          verify: true
          verify-cert-identity: https://github.com/Mar7thLover/PCL-Shion/.github/workflows/release-publish.yml@refs/heads/dev
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload packages and signatures to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [rename_and_release, release_shion]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
