name: Release publish

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string
      replace_existing:
        description: 'Delete the existing release and tag of this version before publishing (re-release the same version)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate_inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version must be a semantic version, e.g. 1.3.0 or 1.3.0-beta.1" >&2
            exit 1
          fi

  validate:
    needs: [validate_inputs]
    permissions:
      contents: read
    uses: ./.github/workflows/shion-build.yml

  changelog:
    needs: [prepare_packages]
    env:
      VERSION: ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse to overwrite an existing version without explicit replacement
        if: ${{ !inputs.replace_existing }}
        run: |
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Version v$VERSION already exists. Enable replace_existing to replace it."
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "v$VERSION"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append runtime and download instructions
        run: |
          cat >> CHANGELOG.md <<'EOF'

          ## Runtime requirements / 运行环境

          Windows、macOS、Linux 统一使用 Avalonia；本次不再发布 WPF。
          **所有包均不包含 .NET 运行时**，请先安装与包架构匹配的 [.NET 10 Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)。普通 Runtime 即可，不需要 Windows Desktop Runtime；已有 .NET 10 SDK 也可运行。

          | 系统 | 文件名后缀 |
          |---|---|
          | Windows x64 / ARM64 | `Avalonia_Windows-x64.exe` / `Avalonia_Windows-ARM64.exe` |
          | macOS Intel / Apple Silicon | `Avalonia_macOS-Intel.tar.gz` / `Avalonia_macOS-AppleSilicon.tar.gz` |
          | Linux x64 / ARM64 | `Avalonia_Linux-x64.tar.gz` / `Avalonia_Linux-ARM64.tar.gz` |

          旧 WPF 的设置和账号不会自动覆盖到 Avalonia，请在新界面重新添加游戏目录与账号。请勿删除原来的游戏目录。macOS 包未经 Apple 公证；首次打开如被系统拦截，确认下载来源后，按 [Apple 官方说明](https://support.apple.com/en-us/102445)进入“系统设置 → 隐私与安全性 → 仍要打开”。Linux 需要 X11 或 XWayland 桌面及系统图形依赖。校验文件见 `SHA256SUMS`。
          EOF

      # 六个平台构建、测试、校验、签名和 changelog 生成均成功后才允许替换旧发布
      - name: Remove existing release and tag
        if: ${{ inputs.replace_existing }}
        run: |
          python3 scripts/test-release-replace.py
          python3 scripts/replace-release.py --repository "$GITHUB_REPOSITORY" --tag "v$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: PCL Shion ${{ inputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_shion:
    name: Build Avalonia (${{ matrix.rid }})
    needs: [validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # Windows 正式入口统一使用 Avalonia；在 Windows 上构建以写入图标
          - rid: win-x64
            os: windows-latest
            label: Windows-x64
          - rid: win-arm64
            os: windows-latest
            label: Windows-ARM64
          - rid: linux-x64
            os: ubuntu-latest
            label: Linux-x64
          - rid: linux-arm64
            os: ubuntu-latest
            label: Linux-ARM64
          - rid: osx-x64
            os: macos-latest
            label: macOS-Intel
          - rid: osx-arm64
            os: macos-latest
            label: macOS-AppleSilicon
      fail-fast: false
    env:
      VERSION: ${{ inputs.version }}
      CONFIGURATION: ${{ inputs.configuration }}
      # Windows 版是单个可执行文件，其他平台打包为 tar.gz 以保留可执行权限。
      # 保留 Avalonia 文件名，使历史 WPF 的自动更新不会误下载不兼容的包。
      PACKAGE: PCL_Shion_${{ inputs.configuration }}_Avalonia_${{ matrix.label }}${{ startsWith(matrix.rid, 'win-') && '.exe' || '.tar.gz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # 所有平台依赖普通 .NET 10 Runtime；单文件仅打包应用及必要的本机依赖
      # 设置 PCL_WRITE_SECRET 后，PCL_ 开头的环境变量会在构建时写入 PCL.Shion.Core 的 BuildSecrets
      - name: Publish
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          dotnet publish PCL.Shion/PCL.Shion.csproj -c "$CONFIGURATION" -r ${{ matrix.rid }} \
          --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" -p:UseSharedCompilation=false -o ./publish

      - name: Verify release payload
        run: |
          python scripts/verify-publish.py --publish-dir ./publish --rid ${{ matrix.rid }} \
            --runtime-config "PCL.Shion/bin/$CONFIGURATION/net10.0/${{ matrix.rid }}/PCL.Shion.runtimeconfig.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win-')
        run: mv ./publish/PCL.Shion.exe "$PACKAGE"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          chmod +x ./publish/PCL.Shion
          mkdir -p "./package/PCL Shion"
          cp -R ./publish/. "./package/PCL Shion/"
          tar -czf "$PACKAGE" -C ./package "PCL Shion"

      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: |
          app="./package/PCL Shion.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R ./publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/PCL.Shion"
          sed "s/@VERSION@/${VERSION%%-*}/g" PCL.Shion/Packaging/macOS/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          iconset=./icon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256; do
            sips -z $size $size PCL.Shion/Assets/Images/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 64 128; do
            cp "$iconset/icon_$((size * 2))x$((size * 2)).png" "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
          # 没有开发者证书，做一次临时签名，否则 Apple 芯片上无法启动
          codesign --force --deep --sign - "$app"
          tar -czf "$PACKAGE" -C ./package "PCL Shion.app"

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_Shion_${{ inputs.configuration }}_${{ matrix.rid }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  # 汇总六个平台的包，校验后统一签名
  prepare_packages:
    needs: [build_shion]
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PCL_Shion_${{ inputs.configuration }}_*-*
          path: ./dist
          merge-multiple: true

      - name: Verify package count and write SHA-256 checksums
        run: |
          count=$(find ./dist -maxdepth 1 -type f | wc -l)
          test "$count" -eq 6
          cd dist
          sha256sum *.exe *.tar.gz > SHA256SUMS

      - name: Sign the packages
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*
          verify: true
          verify-cert-identity: https://github.com/Mar7thLover/PCL-Shion/.github/workflows/release-publish.yml@refs/heads/dev
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Store verified signed packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_Shion_${{ inputs.configuration }}_Signed
          path: ./dist/*
          if-no-files-found: error

  release_shion:
    needs: [prepare_packages, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL_Shion_${{ inputs.configuration }}_Signed
          path: ./dist

      - name: Verify transferred package checksums
        working-directory: ./dist
        run: sha256sum --check SHA256SUMS

      - name: Upload packages and signatures to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [release_shion]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          draft: false
