name: Mirror Chyan (Release Note)

permissions:
  contents: read

on:
  workflow_dispatch:
  release:
    types: [edited]

jobs:
  mirrorchyan:
    if: ${{ vars.MIRRORCHYAN_RID != '' && vars.MIRRORCHYAN_RID != 'PCL2-CE' }}
    runs-on: macos-latest

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@f392b50c411981ee6d33c8ed5e91d66d84d56202 # v1
        with:
          mirrorchyan_rid: ${{ vars.MIRRORCHYAN_RID }}

          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
