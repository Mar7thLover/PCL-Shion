name: Shion Build (CI)

permissions:
  contents: read

on:
  push:
    branches: [dev]
    paths: &build-paths
      - 'PCL.Shion*/**'
      - 'PCL.Core.SourceGenerators/**'
      - 'PCL.Core/App/Localization/Languages/**'
      - 'PCL.Shion.slnx'
      - 'global.json'
      - 'Directory.*'
      - 'NuGet.Config'
      - 'scripts/**'
      - '.github/workflows/shion-build.yml'
      - '.github/workflows/release-publish.yml'
  pull_request:
    paths: *build-paths
  workflow_dispatch:
  workflow_call:

jobs:
  build-test:
    name: Build, Test and Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test release replacement failure handling
        run: python scripts/test-release-replace.py

      - name: Build Avalonia solution
        run: dotnet build PCL.Shion.slnx -c Release

      - name: Test cross-platform core
        run: dotnet test PCL.Shion.Core.Test/PCL.Shion.Core.Test.csproj -c Release --no-build --logger trx --results-directory ./TestResults/core

      - name: Test Avalonia lifecycle and settings
        run: dotnet test PCL.Shion.Test/PCL.Shion.Test.csproj -c Release --no-build --logger trx --results-directory ./TestResults/desktop

      - name: Publish without the .NET runtime
        run: |
          dotnet publish PCL.Shion/PCL.Shion.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -p:DebugSymbols=false -o ./publish

      - name: Verify release payload
        run: |
          python scripts/verify-publish.py --publish-dir ./publish --rid ${{ matrix.rid }} \
            --runtime-config PCL.Shion/bin/Release/net10.0/${{ matrix.rid }}/PCL.Shion.runtimeconfig.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Shion_TestResults_${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
